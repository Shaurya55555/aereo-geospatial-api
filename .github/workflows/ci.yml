name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start with docker compose
        run: docker compose up --build -d
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Upload a sample file and check the result
        run: |
          response=$(curl -sf -F "file=@sample_data/survey.kml" http://localhost:8000/api/files/)
          echo "$response"
          echo "$response" | grep -q '"measurement_crs":"EPSG:32643"'
          id=$(echo "$response" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          curl -sf "http://localhost:8000/api/files/$id/measurements/" | grep -q '"area_m2":1000000.0'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
